<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Capacity Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .reg-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 380px; text-align: center; }
        .reg-box h2 { color: #d35400; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 14px; color: #333; margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        .btn-reg { width: 100%; background-color: #d35400; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-reg:hover { background-color: #b94000; }
        
        .link-login { font-size: 13px; color: #555; text-decoration: none; display: inline-block; margin-top: 10px; }
        .link-login:hover { color: #004aad; text-decoration: underline; }
        
        #msg { font-size: 13px; margin-top: 10px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="reg-box">
        <h2>Create Cloud Account</h2>
        
        <div class="input-group">
            <label>Select Role</label>
            <select id="role">
                <option value="trainee">Trainee</option>
                <option value="trainer">Trainer</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Choose a username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Choose a password">
        </div>

        <button class="btn-reg" onclick="registerUser()">Register User</button>
        <p id="msg"></p>

        <a href="login.html" class="link-login">Already have an account? Login here</a>
    </div>

    <script>
        async function registerUser() {
            let role = document.getElementById("role").value;
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let msgBox = document.getElementById("msg");

            if(!username || !password) {
                msgBox.style.color = "red";
                msgBox.innerText = "Please fill all fields!";
                return;
            }

            try {
                let response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                let data = await response.json();

                if (data.success) {
                    msgBox.style.color = "green";
                    msgBox.innerText = "Registered successfully! Redirecting to login...";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    msgBox.style.color = "red";
                    msgBox.innerText = data.message || "Registration failed!";
                }
            } catch (err) {
                msgBox.style.color = "red";
                msgBox.innerText = "Server error! Make sure backend is running.";
            }
        }
    </script>

</body>
</html>
